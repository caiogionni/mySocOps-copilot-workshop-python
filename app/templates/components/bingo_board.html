<div class="grid grid-cols-5 gap-1 w-full max-w-md mx-auto aspect-square">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="relative flex items-center justify-center p-1 text-center border-gray-300 transition-all duration-150 select-none min-h-[60px] text-xs leading-tight font-bold
        {%- if square.is_marked %}
            {%- if is_winning %} bg-ore text-amber-900 ore-glow marked-square
            {%- else %} bg-grass text-white marked-square
            {%- endif %}
        {%- else %} bg-stone text-white active:bg-stone
        {%- endif %}
        {%- if square.is_free_space %} font-bold text-sm bg-ore text-amber-900{% endif %}"
        style="border: 3px solid #3C2415; position: relative;"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space - CENTER' if square.is_free_space else square.text }}">
        <span class="wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="absolute top-0.5 right-0.5 text-white text-lg" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">✓</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
