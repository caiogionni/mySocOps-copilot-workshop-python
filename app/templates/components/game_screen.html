<div id="game-container">
<div class="flex flex-col min-h-full bg-gray-50">
    <!-- Header - Mining HUD -->
    <header class="flex items-center justify-between p-3 bg-wood border-b border-gray-300">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="text-amber-900 text-sm px-3 py-1.5 active:bg-gray-100 font-bold"
            style="border: 2px solid #3C2415; text-transform: uppercase;">
            🏠 Back
        </button>
        <h1 class="font-bold text-amber-900 text-lg pixel-text" style="text-transform: uppercase;">⛏️ MINING</h1>
        <div class="w-16"></div>
    </header>

    <!-- Mining tip -->
    <p class="text-center text-amber-900 text-sm py-2 px-4 font-semibold" style="background: #C5B59F; border-bottom: 2px solid #8B7355; text-transform: uppercase;">
        💾 Tap a square when you find someone who matches!
    </p>

    <!-- Bingo indicator - Victory -->
    {% if session.has_bingo %}
    <div class="bg-ore text-amber-900 text-center py-3 font-bold text-sm ore-glow" style="border-bottom: 3px solid #CD8500; text-transform: uppercase;">
        ⭐ BINGO! YOU FOUND ORE! ⭐
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
